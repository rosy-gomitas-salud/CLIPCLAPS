services:
  - type: web
    name: clipclaps-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: clipclaps-db
          property: connectionString
databases:
  - name: clipclaps-db
    databaseName: clipclaps
    user: clipclaps_user
    plan: free
    postgresMajorVersion: "18"
